name: Build Install Packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-install-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-vsix:
    name: Build and Verify VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX for Verification
        # The extension bundle includes its runtime dependencies; do not ship node_modules.
        run: npx --yes @vscode/vsce@4.0.0 package --no-dependencies --allow-star-activation --out "$RUNNER_TEMP/pixel-agents-local.vsix"

      - name: Verify VSIX Package and Extension Host
        shell: bash
        env:
          VSIX_PATH: ${{ runner.temp }}/pixel-agents-local.vsix
        run: xvfb-run -a node scripts/verify-vsix-package.mjs "$VSIX_PATH"

      - name: Upload Verified VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pixel-agents-local.vsix
          if-no-files-found: error
          retention-days: 7

  package-npm:
    name: Build and Verify npm Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build and Verify npm Artifact
        shell: bash
        run: npm run verify:npm-package -- --output-dir "$RUNNER_TEMP/npm-package"

      - name: Run Unit Tests
        run: npm test

      - name: Upload Verified npm Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error
          retention-days: 7
